# Local sandbox: SQL Server with dummy Silver data + the MCP server.
#   docker compose -f dev/docker-compose.yml up -d --build
#   docker compose -f dev/docker-compose.yml exec mcp python /opt/smoke/smoke_test.py
name: hangyo-mcp-dev

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "DevSa#Pass2026"
    ports:
      - "14334:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    volumes:
      - ./seed.sql:/seed/seed.sql:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "mssql", "-U", "sa", "-P", "DevSa#Pass2026", "-b", "-i", "/seed/seed.sql"]
    restart: "no"

  mcp:
    build:
      context: ..
    env_file: .env.dev
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "8765:8000"
    volumes:
      - ./smoke_test.py:/opt/smoke/smoke_test.py:ro
